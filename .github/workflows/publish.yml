name: Build and Publish Multi-Arch GeoServer Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'GeoServer version (e.g., 2.28.1, 2.27-SNAPSHOT, 3.0-RC)'
        required: true
        type: string
      build_number:
        description: 'Jenkins build number for RC/milestone (e.g., 20). If provided for RC/milestone builds, fetches WAR from Jenkins artifacts and tags image as {version}-build{number}.'
        required: false
        type: string
        default: ''
      jenkins_job:
        description: 'Jenkins job name for RC/milestone WAR artifacts (e.g., geoserver-release-jdk17)'
        required: false
        type: string
        default: 'geoserver-release-jdk17'
      dry_run:
        description: 'Work out the series, tags and WAR URL and stop, without building or pushing anything.'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - ci/publish-test

concurrency:
  # One run per version; a newer run of the same version replaces the older one
  group: publish-${{ github.event.inputs.version || 'ci-publish-test' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # The release series (main, stable, maintenance) are not configured here: the prepare job
  # works them out from the GeoServer version feed (the updates-checker-v1 branch of geoserver/geoserver),
  # so a new series needs no change to this file.
  PRIMARY_REGISTRY: "geoserver-docker.osgeo.org/geoserver"

jobs:
  # ============================================================
  # JOB 1: Prepare build parameters
  # ============================================================
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      build_number: ${{ steps.parse.outputs.build_number }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      base_image: ${{ steps.parse.outputs.base_image }}
      builder_base_image: ${{ steps.parse.outputs.builder_base_image }}
      branch: ${{ steps.parse.outputs.branch }}
      is_nightly: ${{ steps.parse.outputs.is_nightly }}
      war_url: ${{ steps.parse.outputs.war_url }}
      stable_plugin_url: ${{ steps.parse.outputs.stable_plugin_url }}
      community_plugin_url: ${{ steps.parse.outputs.community_plugin_url }}
      primary_tag: ${{ steps.parse.outputs.primary_tag }}
      additional_tags: ${{ steps.parse.outputs.additional_tags }}
      dry_run: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Determine release series from the version feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FEED="$RUNNER_TEMP/versions.json"
          # Read through the API rather than raw.githubusercontent.com, which caches for minutes
          fetch() {
            for attempt in 1 2 3; do
              gh api -H "Accept: application/vnd.github.raw" "repos/geoserver/geoserver/contents/$1" && return 0
              sleep 5
            done
            return 1
          }
          fetch "versions.json?ref=updates-checker-v1" > "$FEED"
          jq -e '.schema_version == 1 and (.series | length > 0)' "$FEED" > /dev/null \
            || { echo "ERROR: the version feed is not usable" >&2; exit 1; }

          # Documentation and images use a single stable and a single maintenance series,
          # while the feed may list several maintenance series: take the highest.
          STABLE=$(jq -r '[.series[] | select(.phase == "stable") | .series | rtrimstr(".x")] | if length == 1 then .[0] else empty end' "$FEED")
          MAINTENANCE=$(jq -r '[.series[] | select(.phase == "maintenance") | .series | rtrimstr(".x")] | sort_by(split(".") | map(tonumber)) | last // empty' "$FEED")
          if [ -z "$STABLE" ]; then
            echo "ERROR: the version feed does not list exactly one stable series" >&2
            exit 1
          fi

          # The development series is the feed's "main" element
          MAIN=$(jq -r '.main.series // empty | rtrimstr(".x")' "$FEED")
          if [ -z "$MAIN" ]; then
            echo "ERROR: the version feed has no \"main\" element" >&2
            exit 1
          fi

          echo "Series: main=$MAIN stable=$STABLE maintenance=${MAINTENANCE:-none}"
          {
            echo "MAIN_VERSION=$MAIN"
            echo "STABLE_VERSION=$STABLE"
            echo "MAINTENANCE_VERSION=$MAINTENANCE"
            echo "FEED_FILE=$FEED"
          } >> "$GITHUB_ENV"

      - name: Parse Version and Determine Build Parameters
        id: parse
        run: |
          set -euo pipefail
          
          VERSION="${{ inputs.version }}"
          BUILD="${{ inputs.build_number }}"
          JENKINS_JOB="${{ inputs.jenkins_job }}"

          if [ -z "$VERSION" ]; then
            VERSION="${MAIN_VERSION}-SNAPSHOT"
            BUILD=""
            echo "No version input (${GITHUB_EVENT_NAME} trigger). Falling back to VERSION=$VERSION"
          fi
          
          # Default jenkins_job if not provided
          if [ -z "$JENKINS_JOB" ]; then
            JENKINS_JOB="geoserver-release-jdk17"
          fi
          
          # Output version and build number for use in other jobs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD:-github}" >> $GITHUB_OUTPUT
          
          echo "Parsing version: $VERSION"
          
          # Extract major.minor version
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            echo "major=$MAJOR" >> $GITHUB_OUTPUT
            echo "minor=$MINOR" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Unable to parse version $VERSION"
            exit 1
          fi
          
          # Determine base image based on version
          if [[ "$VERSION" == "3"* ]]; then
            BASE_IMAGE="tomcat:11.0-jdk21-temurin-noble"
            BUILDER_BASE_IMAGE="eclipse-temurin:21-jdk-noble"
          elif [[ "$VERSION" == "2.28"* ]]; then
            BASE_IMAGE="tomcat:9.0-jdk21-temurin-noble"
            BUILDER_BASE_IMAGE="eclipse-temurin:21-jdk-noble"
          elif [[ "$VERSION" == "2.27"* ]] || [[ "$VERSION" == "2.26"* ]]; then
            BASE_IMAGE="tomcat:9.0-jdk17-temurin-noble"
            BUILDER_BASE_IMAGE="eclipse-temurin:17-jdk-noble"
          else
            BASE_IMAGE="tomcat:9.0-jdk11-temurin-noble"
            BUILDER_BASE_IMAGE="eclipse-temurin:11-jdk-noble"
          fi
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "builder_base_image=$BUILDER_BASE_IMAGE" >> $GITHUB_OUTPUT
          
          # Determine branch and tag based on version pattern
          if [[ "$VERSION" == *"-M"* ]] || [[ "$VERSION" == *"-RC"* ]]; then
            # Milestone or Release Candidate (e.g., 2.28-M0, 3.0-RC)
            if [ -n "$BUILD" ]; then
              # Pre-release build: Jenkins build number provided
              # Tag includes build number to distinguish from the final RC/milestone tag
              BRANCH="$VERSION"
              PRIMARY_TAG="${VERSION}-build${BUILD}"
              IS_NIGHTLY="true"
            else
              # Final release: no build number, WAR expected on SourceForge
              BRANCH="$VERSION"
              PRIMARY_TAG="$VERSION"
              IS_NIGHTLY="false"
            fi
          elif [[ "$VERSION" == "${{ env.MAIN_VERSION }}"* ]]; then
            # Main branch (e.g., 3.0-SNAPSHOT or 3.0.0)
            if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
              BRANCH="main"
              PRIMARY_TAG="${{ env.MAIN_VERSION }}.x"
              IS_NIGHTLY="true"
            else
              BRANCH="main"
              PRIMARY_TAG="$VERSION"
              IS_NIGHTLY="false"
            fi
          else
            # Stable or maintenance branch
            if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
              BRANCH="${MAJOR}.${MINOR}.x"
              PRIMARY_TAG="${MAJOR}.${MINOR}.x"
              IS_NIGHTLY="true"
            else
              BRANCH="${MAJOR}.${MINOR}.x"
              PRIMARY_TAG="$VERSION"
              IS_NIGHTLY="false"
            fi
          fi
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "is_nightly=$IS_NIGHTLY" >> $GITHUB_OUTPUT
          echo "primary_tag=$PRIMARY_TAG" >> $GITHUB_OUTPUT
          
          # Determine download URLs
          if [[ ("$VERSION" == *"-M"* || "$VERSION" == *"-RC"*) && -n "$BUILD" ]]; then
            # Pre-release RC/Milestone: fetch WAR and extensions from Jenkins artifacts
            WAR_URL="https://build.geoserver.org/view/release/job/${JENKINS_JOB}/${BUILD}/artifact/distribution/${VERSION}/geoserver-${VERSION}-war.zip"
            STABLE_PLUGIN_URL="https://build.geoserver.org/view/release/job/${JENKINS_JOB}/${BUILD}/artifact/distribution/${VERSION}/plugins"
            # Community modules are not part of the release build.
            # Map the RC/milestone version to the corresponding nightly branch
            # so community plugins can be fetched from the nightly build server.
            if [[ "${MAJOR}.${MINOR}" == "${{ env.MAIN_VERSION }}" ]]; then
              COMMUNITY_BRANCH="main"
            else
              COMMUNITY_BRANCH="${MAJOR}.${MINOR}.x"
            fi
            COMMUNITY_PLUGIN_URL="https://build.geoserver.org/geoserver/${COMMUNITY_BRANCH}/community-latest"
          elif [[ "$IS_NIGHTLY" == "true" ]]; then
            WAR_URL="https://build.geoserver.org/geoserver/$BRANCH/geoserver-$BRANCH-latest-war.zip"
            STABLE_PLUGIN_URL="https://build.geoserver.org/geoserver/$BRANCH/ext-latest"
            COMMUNITY_PLUGIN_URL="https://build.geoserver.org/geoserver/$BRANCH/community-latest"
          else
            WAR_URL="https://downloads.sourceforge.net/project/geoserver/GeoServer/$VERSION/geoserver-$VERSION-war.zip"
            STABLE_PLUGIN_URL="https://downloads.sourceforge.net/project/geoserver/GeoServer/${VERSION}/extensions"
            COMMUNITY_PLUGIN_URL="https://build.geoserver.org/geoserver/${BRANCH}/community-latest"
          fi
          
          echo "war_url=$WAR_URL" >> $GITHUB_OUTPUT
          echo "stable_plugin_url=$STABLE_PLUGIN_URL" >> $GITHUB_OUTPUT
          echo "community_plugin_url=$COMMUNITY_PLUGIN_URL" >> $GITHUB_OUTPUT
          
          # Determine additional tags based on version pattern
          ADDITIONAL_TAGS=""
          
          # Add series-latest tag (e.g., 2.28-latest)
          if [[ "$IS_NIGHTLY" == "false" ]]; then
            ADDITIONAL_TAGS="${MAJOR}.${MINOR}-latest"
          fi

          # Add semantic tags for stable/maintenance releases only
          # (main releases get x.y-latest but no semantic tag since they're experimental)
          if [[ "$VERSION" == "${STABLE_VERSION}."* ]] && [[ "$IS_NIGHTLY" == "false" ]]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,stable-latest"
          elif [[ -n "$MAINTENANCE_VERSION" && "$VERSION" == "${MAINTENANCE_VERSION}."* ]] && [[ "$IS_NIGHTLY" == "false" ]]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,maintenance-latest"
          fi

          # Promotion: the first final release of the development series (3.1.0 while 3.0 is stable)
          # makes that series the stable one. The feed cannot say so yet, because it is regenerated
          # only after the release, so the job applies the rule itself, and only ever forwards.
          # maintenance-latest is NOT moved: whether the previous stable series becomes the
          # maintenance series is a decision for the release manager, who retags it by hand.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${MAJOR}.${MINOR}" == "$MAIN_VERSION" ]] \
              && [ -z "$(jq -r --arg s "${MAJOR}.${MINOR}.x" '.series[] | select(.series == $s) | .series' "$FEED_FILE")" ] \
              && [ "$(printf '%s\n%s\n' "$STABLE_VERSION" "${MAJOR}.${MINOR}" | sort -V | tail -n 1)" == "${MAJOR}.${MINOR}" ]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,stable-latest"
            echo "::notice::${MAJOR}.${MINOR} becomes the stable series with this release (stable-latest moves). maintenance-latest is not changed: retag it by hand if ${STABLE_VERSION} is now the maintenance series"
          fi

          # Never move a -latest tag backwards: rebuilding an older release (e.g. 2.27.6 when
          # 2.27.7 is out) must not take over x.y-latest, stable-latest or maintenance-latest.
          #
          # This job is triggered by the Jenkins release job as soon as the release is tagged, but the
          # feed is only regenerated every 15 minutes. So the feed normally does not list the version
          # being built yet: a version newer than the feed's newest is the newest, and only the series
          # (stable, maintenance, main), which change a few times a year, are taken from the feed.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NEWEST=$(jq -r --arg s "${MAJOR}.${MINOR}.x" '.series[] | select(.series == $s) | .latest_version' "$FEED_FILE")
            HIGHEST=$(printf '%s\n%s\n' "${NEWEST:-0.0.0}" "$VERSION" | sort -V | tail -n 1)
            if [ -z "$NEWEST" ]; then
              echo "::notice::the version feed has no ${MAJOR}.${MINOR}.x series yet (the first release of a series, or the feed has not caught up)"
            elif [ "$HIGHEST" != "$VERSION" ]; then
              echo "::warning::$VERSION is older than $NEWEST, the newest release of its series: the -latest tags are not moved"
              ADDITIONAL_TAGS=""
            elif [ "$NEWEST" != "$VERSION" ]; then
              echo "::notice::$VERSION is newer than $NEWEST, the latest in the version feed: the feed has not caught up with this release yet, which is expected"
            fi
          fi

          # Add nightly tags for snapshot builds
          if [[ "$VERSION" == "${MAIN_VERSION}"*"-SNAPSHOT" ]]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,nightly"
          elif [[ "$VERSION" == "${STABLE_VERSION}"*"-SNAPSHOT" ]]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,stable-nightly"
          elif [[ -n "$MAINTENANCE_VERSION" && "$VERSION" == "${MAINTENANCE_VERSION}"*"-SNAPSHOT" ]]; then
            ADDITIONAL_TAGS="$ADDITIONAL_TAGS,maintenance-nightly"
          fi
          
          # Clean up leading comma
          ADDITIONAL_TAGS=$(echo "$ADDITIONAL_TAGS" | sed 's/^,//')
          
          echo "additional_tags=$ADDITIONAL_TAGS" >> $GITHUB_OUTPUT
          
          echo "============================================"
          echo "Build Configuration:"
          echo "  Version: $VERSION"
          echo "  Branch: $BRANCH"
          echo "  Base Image: $BASE_IMAGE"
          echo "  (GDAL) Builder Base Image: $BUILDER_BASE_IMAGE"
          echo "  Is Nightly: $IS_NIGHTLY"
          echo "  Primary Tag: $PRIMARY_TAG"
          echo "  Additional Tags: $ADDITIONAL_TAGS"
          echo "  WAR URL: $WAR_URL"
          echo "============================================"
      
      - name: Validate GeoServer WAR URL
        run: |
          set -euo pipefail
          echo "Validating GeoServer WAR URL: ${{ steps.parse.outputs.war_url }}"
          if ! wget --spider "${{ steps.parse.outputs.war_url }}"; then
            echo "ERROR: GeoServer WAR URL is not accessible: ${{ steps.parse.outputs.war_url }}" >&2
            exit 1
          fi
          echo "GeoServer WAR URL is accessible"

  # ============================================================
  # JOB 2: Build images on native runners (matrix)
  # ============================================================
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.gdal && 'with GDAL' || 'without GDAL' }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 builds
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            gdal: false
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            gdal: true
          # ARM64 builds
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            gdal: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            gdal: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Primary Registry (OSGeo)
        uses: docker/login-action@v4
        with:
          registry: geoserver-docker.osgeo.org
          username: ${{ secrets.OSGEO_REPO_USERNAME }}
          password: ${{ secrets.OSGEO_REPO_PASSWORD }}
      
      - name: Download GeoServer WAR
        run: |
          mkdir -p geoserver
          cd geoserver
          wget -c "${{ needs.prepare.outputs.war_url }}"
      
      - name: Build and export digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            GS_VERSION=${{ needs.prepare.outputs.version }}
            GS_BUILD=${{ needs.prepare.outputs.build_number }}
            BUILD_GDAL=${{ matrix.gdal }}
            GEOSERVER_BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BUILDER_BASE_IMAGE=${{ needs.prepare.outputs.builder_base_image }}
            WAR_ZIP_URL=${{ needs.prepare.outputs.war_url }}
            STABLE_PLUGIN_URL=${{ needs.prepare.outputs.stable_plugin_url }}
            COMMUNITY_PLUGIN_URL=${{ needs.prepare.outputs.community_plugin_url }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}-${{ matrix.gdal && 'gdal' || 'nogdal' }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}-${{ matrix.gdal && 'gdal' || 'nogdal' }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.PRIMARY_REGISTRY }},push-by-digest=true,name-canonical=true,push=true
      
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.gdal && 'gdal' || 'nogdal' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # JOB 3: Merge digests into multi-arch manifests
  # ============================================================
  merge:
    name: Create Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs: 
      - prepare
      - build
    timeout-minutes: 15
    
    steps:
      - name: Download all digests (no GDAL)
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*-nogdal
          merge-multiple: true
          path: /tmp/digests-nogdal
      
      - name: Download all digests (with GDAL)
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*-gdal
          merge-multiple: true
          path: /tmp/digests-gdal
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Primary Registry (OSGeo)
        uses: docker/login-action@v4
        with:
          registry: geoserver-docker.osgeo.org
          username: ${{ secrets.OSGEO_REPO_USERNAME }}
          password: ${{ secrets.OSGEO_REPO_PASSWORD }}
      
      - name: Create manifest list and push to Primary Registry (no GDAL)
        working-directory: /tmp/digests-nogdal
        run: |
          set -euo pipefail
          
          # Validate digest files exist
          DIGEST_COUNT=$(ls -1 2>/dev/null | wc -l)
          if [ "$DIGEST_COUNT" -eq 0 ]; then
            echo "ERROR: No digest files found in /tmp/digests-nogdal" >&2
            echo "Expected digests from build jobs (amd64 and arm64)" >&2
            exit 1
          fi
          echo "Found $DIGEST_COUNT digest file(s)"
          
          PRIMARY_TAG="${{ needs.prepare.outputs.primary_tag }}"
          ADDITIONAL_TAGS="${{ needs.prepare.outputs.additional_tags }}"
          
          # Build tag list for primary registry
          TAGS="${{ env.PRIMARY_REGISTRY }}:$PRIMARY_TAG"
          
          if [ -n "$ADDITIONAL_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$ADDITIONAL_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              TAGS="$TAGS ${{ env.PRIMARY_REGISTRY }}:$tag"
            done
          fi
          
          # Create manifest and push to primary registry
          docker buildx imagetools create $(printf -- '-t %s ' $TAGS) \
            $(printf '${{ env.PRIMARY_REGISTRY }}@sha256:%s ' *)
          
          echo "Created manifest for tags: $TAGS"
      
      - name: Create manifest list and push (with GDAL)
        working-directory: /tmp/digests-gdal
        run: |
          set -euo pipefail
          
          # Validate digest files exist
          DIGEST_COUNT=$(ls -1 2>/dev/null | wc -l)
          if [ "$DIGEST_COUNT" -eq 0 ]; then
            echo "ERROR: No digest files found in /tmp/digests-gdal" >&2
            echo "Expected digests from build jobs (amd64 and arm64)" >&2
            exit 1
          fi
          echo "Found $DIGEST_COUNT digest file(s)"
          
          PRIMARY_TAG="${{ needs.prepare.outputs.primary_tag }}-gdal"
          ADDITIONAL_TAGS="${{ needs.prepare.outputs.additional_tags }}"
          
          # Build tag list with -gdal suffix
          TAGS="${{ env.PRIMARY_REGISTRY }}:$PRIMARY_TAG"
          
          if [ -n "$ADDITIONAL_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$ADDITIONAL_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              TAGS="$TAGS ${{ env.PRIMARY_REGISTRY }}:$tag-gdal"
            done
          fi
          
          # Create manifest
          docker buildx imagetools create $(printf -- '-t %s ' $TAGS) \
            $(printf '${{ env.PRIMARY_REGISTRY }}@sha256:%s ' *)
          
          echo "Created manifest for tags: $TAGS"
      
      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}
          docker buildx imagetools inspect ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}-gdal
      
      - name: Generate Job Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## GeoServer Multi-Arch Build Summary
          
          ### Build Information
          - **Version**: ${{ needs.prepare.outputs.version }}
          - **Build Number**: ${{ needs.prepare.outputs.build_number }}
          - **Base Image**: ${{ needs.prepare.outputs.base_image }}
          - **(GDAL) Builder Base Image**: ${{ needs.prepare.outputs.builder_base_image }}
          - **Is Nightly**: ${{ needs.prepare.outputs.is_nightly }}
          
          ### Images Created
          
          #### Without GDAL
          EOF

          echo "- Primary: ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}" >> $GITHUB_STEP_SUMMARY
          
          # Add additional tags if present
          ADDITIONAL_TAGS="${{ needs.prepare.outputs.additional_tags }}"
          if [ -n "$ADDITIONAL_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$ADDITIONAL_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "- Additional: ${{ env.PRIMARY_REGISTRY }}:$tag" >> $GITHUB_STEP_SUMMARY
            done
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          #### With GDAL
          - Primary: ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}-gdal
          EOF
          
          if [ -n "$ADDITIONAL_TAGS" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "$ADDITIONAL_TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "- Additional: ${{ env.PRIMARY_REGISTRY }}:$tag-gdal" >> $GITHUB_STEP_SUMMARY
            done
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          
          ### Architectures
          - linux/amd64
          - linux/arm64
          
          ### Pull Commands
          ```bash
          # Without GDAL
          docker pull ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}
          
          # With GDAL
          docker pull ${{ env.PRIMARY_REGISTRY }}:${{ needs.prepare.outputs.primary_tag }}-gdal
          ```
          EOF
